name: aiworkhub

services:

  # ============================================================
  # PostgreSQL + pgvector
  # Transactional data + RAG/vector data
  # ============================================================
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    container_name: aiworkhub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "postgres"
      TZ: "UTC"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend/database/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d postgres'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s


  # ============================================================
  # MongoDB
  # AI Agent + Autonomous Bug Fix execution data
  # ============================================================
  mongodb:
    image: mongo:8.0
    container_name: aiworkhub-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
      TZ: "UTC"

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - "${MONGO_INITDB_ROOT_USERNAME}"
        - --password
        - "${MONGO_INITDB_ROOT_PASSWORD}"
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s


  # ============================================================
  # Redis
  # Cache + sessions + locks + temporary state
  # ============================================================
  redis:
    image: redis:7.4
    container_name: aiworkhub-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s


  # ============================================================
  # Apache Kafka
  # Event / message bus between microservices
  # KRaft single-node development configuration
  # ============================================================
  kafka:
    image: apache/kafka:4.1.2
    container_name: aiworkhub-kafka
    restart: unless-stopped

    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NODE_ID: "1"

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    ports:
      - "127.0.0.1:9092:9092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - kafka:19092
        - --list
      interval: 15s
      timeout: 15s
      retries: 16
      start_period: 30s
  # ============================================================
  # MinIO
  # S3-compatible object storage
  # Files + documents + artifacts
  # ============================================================
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aiworkhub-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s


# ==============================================================
# Persistent Volumes
# ==============================================================
volumes:

  postgres_data:
    name: aiworkhub_postgres_data

  mongodb_data:
    name: aiworkhub_mongodb_data

  redis_data:
    name: aiworkhub_redis_data

  kafka_data:
    name: aiworkhub_kafka_data

  minio_data:
    name: aiworkhub_minio_data